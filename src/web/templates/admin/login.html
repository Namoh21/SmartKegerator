<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — SmartKegerator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" nonce="{{ csp_nonce }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" nonce="{{ csp_nonce }}">
  <style nonce="{{ csp_nonce }}">
    :root { --sk-accent: #e94560; --sk-bg: #1a1a2e; --sk-card: #16213e; }
    body  { background-color: var(--sk-bg); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--sk-card); border: 1px solid #2a2a4e;
                  border-radius: .75rem; padding: 2.5rem; width: 100%; max-width: 380px; }
    .brand { color: var(--sk-accent); font-weight: 700; font-size: 1.4rem; }
    .btn-accent { background-color: var(--sk-accent); color: #fff; border: none; }
    .btn-accent:hover { background-color: #c73652; color: #fff; }
  </style>
</head>
<body>
<div class="login-card shadow-lg">
  <div class="text-center mb-4">
    <div class="brand mb-1"><i class="bi bi-cup-fill me-2"></i>SmartKegerator</div>
    <h5 class="text-white mb-0">Admin Login</h5>
    <p class="text-muted small mt-1 mb-0">
      <a href="/" class="text-muted">← Back to dashboard</a>
    </p>
  </div>

  {% if created %}
  <div class="alert alert-success py-2 small">
    <i class="bi bi-check-circle me-1"></i>Account created. Log in to continue.
  </div>
  {% endif %}

  {% if error %}
  <div class="alert alert-danger py-2 small">
    <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
  </div>
  {% endif %}

  <form method="post" action="/admin/login" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">

    <div class="mb-3">
      <label class="form-label">Admin username</label>
      <input type="text" class="form-control" name="username"
             required autofocus autocomplete="username">
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password"
             required autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-accent w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i>Log In
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" nonce="{{ csp_nonce }}"></script>
</body>
</html>
