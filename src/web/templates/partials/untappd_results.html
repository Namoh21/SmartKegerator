{% if results %}
<div class="list-group mt-2" style="max-height: 320px; overflow-y: auto;">
  {% for item in results %}
  {% set beer   = item.beer %}
  {% set brewery = item.brewery %}
  <button type="button"
          class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-2 js-fill-beer"
          style="background: var(--sk-card); border-color: #2a2a4e;"
          data-name="{{ beer.beer_name }}"
          data-company="{{ brewery.brewery_name }}"
          data-location="{{ brewery.location.brewery_city ~ ', ' ~ brewery.location.country_name }}"
          data-style="{{ beer.beer_style }}"
          data-abv="{{ beer.beer_abv }}"
          data-ibu="{{ beer.beer_ibu | int }}"
          data-description="{{ beer.beer_description | replace('"', '&quot;') }}"
          data-untappd-id="{{ beer.bid }}"
          data-untappd-rating="{{ '%.2f' | format(beer.rating_score) }}"
          data-label-url="{{ beer.beer_label }}">

    {% if beer.beer_label %}
    <img src="{{ beer.beer_label }}" width="40" height="40"
         style="object-fit: cover; border-radius: 4px;" loading="lazy"
         onerror="this.style.display='none'">
    {% else %}
    <span style="width:40px;height:40px;display:inline-block;"></span>
    {% endif %}

    <div class="flex-grow-1 text-start">
      <div class="fw-semibold text-white">{{ beer.beer_name }}</div>
      <div class="small text-muted">{{ brewery.brewery_name }} &middot; {{ beer.beer_style }}</div>
    </div>

    <div class="text-end small">
      <div class="text-accent fw-semibold">{{ '%.2f' | format(beer.rating_score) }}</div>
      <div class="text-muted">{{ beer.beer_abv }}% ABV</div>
    </div>
  </button>
  {% endfor %}
</div>
{% else %}
<p class="text-muted small mt-2">No results for "{{ query }}".</p>
{% endif %}
