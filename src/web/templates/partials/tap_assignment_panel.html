<div class="row g-3">
  {% for tap_id, tap_display in configured_taps %}
  {% set current_keg_id = taps.get_keg_id(tap_id) %}
  <div class="col-md-{{ (12 // configured_taps|length) }}">
    <form hx-post="/kegs/assign-tap"
          hx-target="#tap-assignment-panel"
          hx-swap="innerHTML"
          hx-indicator="#tap-spinner-{{ loop.index }}"
          class="d-flex gap-2 align-items-end">
      <input type="hidden" name="tap" value="{{ tap_id }}">
      <div class="flex-grow-1">
        <label class="form-label tap-label">{{ tap_display | upper }}</label>
        <select class="form-select" name="keg_id">
          <option value="none" {% if current_keg_id is none %}selected{% endif %}>— Empty —</option>
          {% for keg in all_kegs %}
          {% set b = namespace(name="Unknown") %}
          {% for s in stats %}{% if s.keg.id == keg.id %}{% set b.name = s.beer.name if s.beer else "Unknown" %}{% endif %}{% endfor %}
          <option value="{{ keg.id }}" {% if keg.id == current_keg_id %}selected{% endif %}>
            #{{ keg.id }} · {{ b.name }} ({{ keg.percent_remaining | pct }} left)
          </option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-sm btn-outline-secondary">
        <span id="tap-spinner-{{ loop.index }}" class="htmx-indicator spinner-border spinner-border-sm"></span>
        Set
      </button>
    </form>
  </div>
  {% endfor %}
</div>
