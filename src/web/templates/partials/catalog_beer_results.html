{% if results %}
<div class="mt-2 border rounded shadow-sm" style="background:var(--sk-card);max-height:280px;overflow-y:auto;z-index:1055;position:relative;">
  <div class="px-2 py-1 border-bottom" style="font-size:.75rem;color:var(--sk-muted);">
    {{ results|length }} result(s) — click to fill form
  </div>
  {% for item in results %}
  <button type="button"
          class="w-100 d-flex align-items-center gap-3 px-3 py-2 border-0 border-bottom text-start js-fill-beer"
          style="background:transparent;cursor:pointer;transition:background .1s;"
          onmouseover="this.style.background='var(--sk-border)'"
          onmouseout="this.style.background='transparent'"
          data-name="{{ item.name }}"
          data-company="{{ item.brewer.name if item.brewer else '' }}"
          data-location="{{ item.country.title if item.country else '' }}"
          data-style="{{ item.style or '' }}"
          data-abv="{{ item.abv or '' }}"
          data-ibu="{{ item.ibu | int if item.ibu else 0 }}"
          data-description="{{ (item.description or '') | replace('"', '&quot;') }}"
          data-catalog-id="{{ item.id }}"
          data-label-url="">

    <i class="bi bi-cup-fill flex-shrink-0" style="font-size:1.4rem;color:var(--sk-accent);"></i>

    <div class="flex-grow-1 min-w-0">
      <div class="fw-semibold text-white text-truncate">{{ item.name }}</div>
      <div class="small text-muted text-truncate">
        {{ item.brewer.name if item.brewer else '—' }}
        {% if item.style %}&nbsp;&middot;&nbsp;{{ item.style }}{% endif %}
      </div>
    </div>

    <div class="flex-shrink-0 text-end small">
      {% if item.abv %}<div class="fw-semibold" style="color:var(--sk-accent);">{{ item.abv }}%</div>{% endif %}
      {% if item.ibu %}<div class="text-muted">{{ item.ibu }} IBU</div>{% endif %}
    </div>
  </button>
  {% endfor %}
</div>
{% elif query %}
<div class="mt-2 p-2 text-muted small border rounded" style="background:var(--sk-card);">
  No results found for <strong>{{ query }}</strong> — try a different search or enter details manually.
</div>
{% endif %}
