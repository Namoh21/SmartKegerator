<!-- Shared form fields for Add/Edit Keg modals -->
<div class="mb-3">
  <label class="form-label">Beer <span class="text-danger">*</span></label>
  <select class="form-select" name="beer_id" required>
    <option value="">— Select Beer —</option>
    {% for beer in beers %}
    <option value="{{ beer.id }}" {% if keg and keg.beer_id == beer.id %}selected{% endif %}>
      {{ beer.name }}{% if beer.company %} · {{ beer.company }}{% endif %}
    </option>
    {% endfor %}
  </select>
</div>
<div class="row g-2">
  <div class="col-md-6 mb-3">
    <label class="form-label">Capacity (L) <span class="text-danger">*</span></label>
    <input type="number" class="form-control" name="capacity" step="0.1" min="0.1" required
           value="{{ keg.liters_capacity if keg else '18.9' }}"
           placeholder="e.g. 18.9">
    <div class="form-text">Common: 5 L · 9.9 L · 18.9 L (½ bbl) · 49.2 L (full)</div>
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">Total cost ($)</label>
    <input type="number" class="form-control" name="price" step="0.01" min="0"
           value="{{ '%.2f'|format(keg.price) if keg else '0.00' }}">
  </div>
</div>
<div class="row g-2">
  <div class="col-md-6 mb-3">
    <label class="form-label">Date tapped <span class="text-danger">*</span></label>
    <input type="date" class="form-control" name="date_bought" required
           value="{{ keg.date_bought.strftime('%Y-%m-%d') if keg else '' }}">
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">Warmest temp (°F)</label>
    <input type="number" class="form-control" name="warmest_temp" step="0.1"
           value="{{ '%.1f'|format(keg.warmest_temp) if keg else '0.0' }}">
  </div>
</div>
