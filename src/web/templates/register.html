<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join — SmartKegerator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" nonce="{{ csp_nonce }}">
  <link href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet" nonce="{{ csp_nonce }}">
  <style nonce="{{ csp_nonce }}">
    :root { --sk-accent: #e94560; --sk-bg: #1a1a2e; --sk-card: #16213e; }
    body  { background-color: var(--sk-bg); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; }
    .reg-card { background: var(--sk-card); border: 1px solid #2a2a4e;
                border-radius: .75rem; padding: 2.5rem; width: 100%; max-width: 400px; }
    .brand { color: var(--sk-accent); font-weight: 700; font-size: 1.4rem; }
    .btn-accent { background-color: var(--sk-accent); color: #fff; border: none; }
    .btn-accent:hover { background-color: #c73652; color: #fff; }
  </style>
</head>
<body>
<div class="reg-card shadow-lg">
  <div class="text-center mb-4">
    <div class="brand mb-1"><i class="bi bi-cup-fill me-2"></i>SmartKegerator</div>
    <h5 class="text-white mb-0">Add Yourself</h5>
    <p class="text-muted small mt-1 mb-0">
      Enter your name to create a profile. The kegerator will
      recognise you by face — no password needed.
    </p>
  </div>

  {% if error %}
  <div class="alert alert-danger py-2 small">
    <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
  </div>
  {% endif %}

  <form method="post" action="/register" autocomplete="off">
    <div class="mb-4">
      <label class="form-label">Your name <span class="text-muted small">(shown on the leaderboard)</span></label>
      <input type="text" class="form-control" name="name"
             placeholder="First name or nickname" required autofocus autocomplete="name">
    </div>

    <button type="submit" class="btn btn-accent w-100">
      <i class="bi bi-person-check me-1"></i>Create Profile
    </button>
  </form>

  <div class="text-center mt-3">
    <a href="/" class="text-muted small">← Back to dashboard</a>
  </div>
</div>
<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js" nonce="{{ csp_nonce }}"></script>
</body>
</html>
